[package]
name = "gammaloop-workspace-hack"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"

# Preserve the two non-Hakari feature anchors that GammaLoop maintains for
# Vakint. The generated workspace-wide dependency list is intentionally
# omitted because it is not safe in a downstream workspace.
[dependencies]
arrayvec = { version = "0.7", features = ["std"] }
indenter = { version = "0.3", features = ["std"] }

[build-dependencies]
arrayvec = { version = "0.7", features = ["std"] }
indenter = { version = "0.3", features = ["std"] }
